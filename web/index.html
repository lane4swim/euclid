<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Zirkel und Lineal</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/ui/app.js"></script>
</head>
<body>
  <header class="toolbar">
    <h1 class="brand" data-i18n="app.title">Zirkel und Lineal</h1>

    <div class="group tools" role="group" data-i18n-title="ui.tools">
      <button type="button" data-tool="move" data-kbd="1" data-i18n-title="tool.move">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 8-6 1.5L10 19z"/></svg>
        <span data-i18n="tool.move">Bewegen</span><kbd>1</kbd>
      </button>
      <button type="button" data-tool="line" data-kbd="2" data-i18n-title="tool.line">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19L21 5"/><circle cx="8" cy="15" r="2"/><circle cx="16" cy="9" r="2"/></svg>
        <span data-i18n="tool.line">Gerade</span><kbd>2</kbd>
      </button>
      <button type="button" data-tool="circle" data-kbd="3" data-i18n-title="tool.circle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.6"/><circle cx="20" cy="12" r="1.6"/></svg>
        <span data-i18n="tool.circle">Kreis</span><kbd>3</kbd>
      </button>
      <button type="button" data-tool="circleRigid" data-kbd="4" data-i18n-title="tool.circleRigid">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="14" cy="13" r="7"/><path d="M2 4h7"/><circle cx="2.5" cy="4" r="1.4"/><circle cx="9" cy="4" r="1.4"/></svg>
        <span data-i18n="tool.circleRigid">Kreis mit Abstand</span><kbd>4</kbd>
      </button>
      <button type="button" data-tool="segment" data-kbd="5" data-i18n-title="tool.segment">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18L18 6"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/></svg>
        <span data-i18n="tool.segment">Strecke</span><kbd>5</kbd>
      </button>
      <button type="button" data-tool="intersect" data-kbd="6" data-i18n-title="tool.intersect">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/><circle cx="12" cy="7.5" r="1.8" class="fill"/></svg>
        <span data-i18n="tool.intersect">Schnittpunkt</span><kbd>6</kbd>
      </button>
      <button type="button" data-tool="point" data-kbd="7" data-i18n-title="tool.point">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" class="fill"/><circle cx="12" cy="12" r="7"/></svg>
        <span data-i18n="tool.point">Punkt</span><kbd>7</kbd>
      </button>
    </div>

    <div class="group" role="group">
      <button type="button" id="btn-undo" data-action="undo" data-kbd="Ctrl+Z" data-i18n-title="ui.undo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button type="button" id="btn-redo" data-action="redo" data-kbd="Ctrl+Shift+Z" data-i18n-title="ui.redo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
      </button>
    </div>

    <div class="group" role="group">
      <details id="new-menu" class="menu">
        <summary data-i18n="ui.newMenu">Neu</summary>
        <!-- Filled from presets.json at startup -->
        <div class="menu-items" id="new-menu-items"></div>
      </details>
      <button type="button" data-action="save" data-i18n-title="ui.save"><span data-i18n="ui.save">Speichern</span></button>
      <button type="button" data-action="load" data-i18n-title="ui.load"><span data-i18n="ui.load">Öffnen</span></button>
      <input type="file" id="file-input" accept=".json,application/json" hidden>
      <details id="export-menu" class="menu">
        <summary data-i18n="ui.export">Export</summary>
        <div class="menu-items">
          <button type="button" data-action="export-svg" data-i18n="ui.exportSvg">SVG-Datei</button>
          <button type="button" data-action="export-png-white" data-i18n="ui.exportPngWhite">PNG, weißer Hintergrund</button>
          <button type="button" data-action="export-png-transparent" data-i18n="ui.exportPngTransparent">PNG, transparent</button>
          <hr>
          <button type="button" data-action="export-md" data-i18n="ui.exportMd">Schritte als Markdown</button>
          <button type="button" data-action="export-html" data-i18n="ui.exportHtml">Schritte als HTML-Seite</button>
        </div>
      </details>
    </div>

    <div class="group" role="group">
      <label class="check"><input type="checkbox" id="infinite"> <span data-i18n="ui.infinite">Geraden unendlich</span></label>
      <button type="button" data-action="fit" data-kbd="F" data-i18n-title="ui.fit"><span data-i18n="ui.fit">Einpassen</span></button>
      <button type="button" id="btn-step-through" data-action="step-through" data-kbd="S" data-i18n-title="ui.stepThrough" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14l9-7z"/><path d="M18 5v14"/></svg>
        <span data-i18n="ui.stepThrough">Schritt für Schritt</span>
      </button>
    </div>

    <div class="group settings" role="group">
      <label><span class="sr-only" data-i18n="ui.theme">Darstellung</span>
        <select id="theme">
          <option value="auto" data-i18n="theme.auto">Automatisch</option>
          <option value="light" data-i18n="theme.light">Hell</option>
          <option value="dark" data-i18n="theme.dark">Dunkel</option>
        </select>
      </label>
      <label><span class="sr-only" data-i18n="ui.lang">Sprache</span>
        <select id="lang">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
        </select>
      </label>
    </div>
  </header>

  <main>
    <section id="canvas-wrap" class="canvas-wrap">
      <svg id="drawing" role="img" tabindex="0" aria-label="Zeichenfläche"></svg>
      <p id="status" class="status" aria-live="polite"></p>
      <div id="stepper" class="stepper" role="region" data-i18n-title="ui.stepper" hidden>
        <button type="button" class="icon" data-step="first" data-i18n-title="ui.stepFirst"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14"/><path d="M18 5l-9 7 9 7z"/></svg></button>
        <button type="button" class="icon" data-step="prev" data-i18n-title="ui.stepPrev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="stepper-text">
          <span id="stepper-count" class="stepper-count"></span>
          <span id="stepper-desc" class="stepper-desc" aria-live="polite"></span>
        </div>
        <button type="button" class="icon" data-step="next" data-i18n-title="ui.stepNext"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        <button type="button" class="icon" data-step="last" data-i18n-title="ui.stepLast"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14"/><path d="M6 5l9 7-9 7z"/></svg></button>
        <button type="button" class="icon" data-step="close" data-i18n-title="ui.stepClose"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p id="toast" class="toast" role="status" aria-live="assertive" hidden></p>
      <input id="name-field" class="name-field" type="text" maxlength="24" spellcheck="false" autocomplete="off" hidden>
    </section>

    <aside class="steps" aria-labelledby="steps-title">
      <h2 id="steps-title" data-i18n="ui.steps">Konstruktion</h2>
      <p id="given" class="given"></p>
      <p id="no-steps" class="empty" data-i18n="ui.noSteps"></p>
      <ol id="step-list" class="step-list" role="listbox" aria-labelledby="steps-title"></ol>
    </aside>
  </main>
</body>
</html>
